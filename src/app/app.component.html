<header class="topo">
  <div class="container topo-conteudo">
    <div class="marca">
      <span class="logo" aria-hidden="true">A</span>
      <div>
        <h1>{{ title }}</h1>
        <p>App em execução 🎉</p>
      </div>
    </div>

    <nav aria-label="Navegação principal">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Home
      </a>
      <a routerLink="/sobre" routerLinkActive="active">Sobre</a>
    </nav>
  </div>
</header>

<main class="container">
  <router-outlet></router-outlet>
</main>

<footer class="rodape">
  <div class="container">
    <p>Lab 1 – Angular · Fundamentos, componentes, diretivas e rotas</p>
  </div>
</footer>
